<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="code" width="200" height="120" patternUnits="userSpaceOnUse">
      <text x="10" y="20" fill="#38bdf8" opacity="0.08" font-family="monospace" font-size="11">const cs = require('future');</text>
      <text x="10" y="40" fill="#38bdf8" opacity="0.08" font-family="monospace" font-size="11">import { innovate } from 'cs';</text>
      <text x="10" y="60" fill="#38bdf8" opacity="0.08" font-family="monospace" font-size="11">class Developer { }</text>
      <text x="10" y="80" fill="#38bdf8" opacity="0.08" font-family="monospace" font-size="11">async function build() { }</text>
      <text x="10" y="100" fill="#38bdf8" opacity="0.08" font-family="monospace" font-size="11">export default CSDept;</text>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#code)"/>
  <!-- Circuit lines -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.2"/>
  <circle cx="1050" cy="650" r="80" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.2"/>
  <line x1="150" y1="150" x2="400" y2="300" stroke="#6366f1" stroke-width="1.5" opacity="0.15"/>
  <line x1="400" y1="300" x2="700" y2="200" stroke="#6366f1" stroke-width="1.5" opacity="0.15"/>
  <line x1="700" y1="200" x2="1050" y2="650" stroke="#22d3ee" stroke-width="1.5" opacity="0.15"/>
  <!-- CS Building silhouette -->
  <rect x="350" y="280" width="500" height="320" rx="8" fill="#1e293b" opacity="0.6"/>
  <rect x="380" y="310" width="80" height="60" rx="4" fill="#38bdf8" opacity="0.15"/>
  <rect x="480" y="310" width="80" height="60" rx="4" fill="#38bdf8" opacity="0.15"/>
  <rect x="580" y="310" width="80" height="60" rx="4" fill="#38bdf8" opacity="0.15"/>
  <rect x="680" y="310" width="80" height="60" rx="4" fill="#38bdf8" opacity="0.15"/>
  <rect x="780" y="310" width="40" height="60" rx="4" fill="#38bdf8" opacity="0.15"/>
  <rect x="420" y="400" width="360" height="180" rx="6" fill="#0f172a" opacity="0.5"/>
  <text x="600" y="500" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="28" font-weight="bold" opacity="0.4">COMPUTER SCIENCE</text>
  <text x="600" y="540" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="18" opacity="0.35">DEPARTMENT</text>
  <!-- Decorative brackets -->
  <text x="80" y="400" fill="#6366f1" font-family="monospace" font-size="120" opacity="0.1">{</text>
  <text x="1080" y="500" fill="#6366f1" font-family="monospace" font-size="120" opacity="0.1">}</text>
</svg>
